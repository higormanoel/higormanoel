name: Atualizar card PokeDev

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/generate-pokemon-contributions.mjs
      - .github/workflows/update-pokemon-contributions.yml

permissions:
  contents: write

concurrency:
  group: pokedev-card
  cancel-in-progress: true

jobs:
  generate-card:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Gerar card com dados reais do GitHub
        run: node scripts/generate-pokemon-contributions.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}

      - name: Publicar card atualizado
        run: |
          if git diff --quiet -- assets/pokemon-contributions.svg; then
            echo "Nenhuma mudanca no card."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pokemon-contributions.svg
          git commit -m "chore: update PokeDev card"
          git push
